[build]
  publish = "."

[build.environment]
  # A model name is not a secret. Without this, Netlify's secrets scan fails the build
  # because the default model name in api.mjs matches the AI_MODEL variable.
  SECRETS_SCAN_OMIT_KEYS = "AI_MODEL"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
